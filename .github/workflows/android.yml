name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-android-arm64:
    name: Build (Android ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: '5.3.0'
          dune-cache: true
      - name: Build
        run: |
          opam install dune dune-configurator
          opam exec -- dune build
          cp _build/default/mp3packer.exe mp3packer-android-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mp3packer-android-arm64
          path: mp3packer-android-arm64
